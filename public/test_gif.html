<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Canvas Display</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
        }
        #canvas-container {
            margin-top: 20px;
        }
        #color-canvas {
            border: 1px solid #ddd;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <h1>Test Canvas Display</h1>
    <div id="canvas-container">
        <canvas id="color-canvas" width="200" height="200"></canvas>
    </div>
    <script>
        async function fetchAndDisplayColors() {
            try {
                const response = await fetch('/user-stories');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                if (data && data.length > 0 && data[0].colorArray) {
                    const colorArray = data[0].colorArray;
                    const canvas = document.getElementById('color-canvas');
                    const ctx = canvas.getContext('2d');
                    const width = canvas.width;
                    const height = canvas.height;
                    const numColors = colorArray.length;
                    const rectWidth = width / numColors;
                    for (let i = 0; i < numColors; i++) {
                        ctx.fillStyle = colorArray[i];
                        ctx.fillRect(i * rectWidth, 0, rectWidth, height);
                    }
                } else {
                    console.error("No color data found");
                    const canvasContainer = document.getElementById('canvas-container');
                    canvasContainer.textContent = "No color data found";
                }
            } catch (error) {
                console.error("Failed to fetch color data", error);
                const canvasContainer = document.getElementById('canvas-container');
                canvasContainer.textContent = "Failed to fetch color data";
            }
        }
        fetchAndDisplayColors();
    </script>
</body>
</html>
